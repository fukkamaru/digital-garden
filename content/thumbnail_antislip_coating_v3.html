<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>縞鋼板の防滑性向上に「塗る」すべり止め材</title>
  <style>
    :root {
      --canvas-w: 3840px;
      --canvas-h: 2160px;
      --blue: #132c93;
      --gold: #a58400;
      --black: #111111;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #2b2b2b;
      font-family: "Noto Sans JP","Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-width: var(--canvas-w);
      min-height: var(--canvas-h);
    }
    .thumbnail {
      position: relative;
      width: var(--canvas-w);
      height: var(--canvas-h);
      overflow: hidden;
      background: var(--white);
      isolation: isolate;
    }
    .main-photo-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }
    .main-photo {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    .left-panel {
      position: absolute;
      inset: 0 auto 0 0;
      width: 66%;
      z-index: 2;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,1) 0%,
        rgba(255,255,255,1) 74%,
        rgba(255,255,255,0.97) 83%,
        rgba(255,255,255,0.78) 92%,
        rgba(255,255,255,0.20) 100%
      );
      pointer-events: none;
    }
    .copy {
      position: absolute;
      z-index: 4;
      left: 110px;
      top: 92px;
      width: 2380px;
      color: var(--black);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.98;
      text-shadow: 0 8px 0 rgba(255,255,255,0.98), 0 12px 24px rgba(0,0,0,0.12);
    }
    .lead {
      font-size: 238px;
      white-space: nowrap;
      margin-bottom: 88px;
    }
    .headline {
      display: flex;
      align-items: baseline;
      white-space: nowrap;
      gap: 10px;
      font-size: 340px;
      margin-left: 6px;
      margin-top: 34px;
    }
    .headline .blue {
      color: var(--blue);
      font-size: 500px;
      line-height: 0.86;
      letter-spacing: -0.09em;
      margin-right: -8px;
      text-shadow: 0 9px 0 rgba(255,255,255,1), 0 14px 26px rgba(0,0,0,0.14);
    }
    .headline .rest { color: var(--black); }
    .subcopy {
      display: inline-flex;
      align-items: center;
      margin-top: 150px;
      margin-left: 5px;
      padding: 28px 58px 32px;
      font-size: 176px;
      line-height: 1;
      color: #ffffff;
      background: #183A8F;
      white-space: nowrap;
      text-shadow: none;
      box-shadow: 0 14px 28px rgba(0,0,0,0.16);
    }
    .inset {
      position: absolute;
      z-index: 5;
      left: 66px;
      bottom: 78px;
      width: 1190px;
      height: 870px;
      background: #fff;
      border: 18px solid #fff;
      box-shadow: 0 18px 34px rgba(0,0,0,0.26);
      overflow: hidden;
      clip-path: polygon(0 0,100% 0,100% 92%,94% 100%,0 100%);
      margin: 0;
    }
    .inset img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
    }
    .boundary-glow {
      position: absolute;
      z-index: 3;
      left: 56%;
      top: 0;
      width: 15%;
      height: 100%;
      background: linear-gradient(90deg,rgba(255,255,255,0.45),rgba(255,255,255,0.06));
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="thumbnail" aria-label="YouTube thumbnail">
    <div class="main-photo-wrap">
      <img class="main-photo" src="main_construction_yellow.png" alt="縞鋼板へ黄色い防滑材をローラー施工している様子" />
    </div>
    <div class="left-panel"></div>
    <div class="boundary-glow"></div>
    <section class="copy">
      <div class="lead">縞鋼板の防滑性向上に</div>
      <div class="headline">
        <span class="blue">『塗る』</span>
        <span class="rest">すべり止め材</span>
      </div>
      <div class="subcopy">ローラーで簡単施工</div>
    </section>
    <figure class="inset">
      <img src="texture_material_yellow.png" alt="黄色い防滑材の粘度とテクスチャ" />
    </figure>
  </main>
</body>
</html>
